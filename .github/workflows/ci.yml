name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Everything builds on Linux thanks to EnableWindowsTargeting, but only the
  # cross-platform package can be *run* here: EasyImage needs GDI+ and Printer needs
  # the Windows Desktop runtime, neither of which exists on a Linux agent.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build everything
        run: dotnet build BalaReva.Revived.sln -c Release

      - name: Test the cross-platform package
        run: dotnet test tests/BalaReva.EasyText.Tests/BalaReva.EasyText.Tests.csproj -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/BalaReva.EasyText/BalaReva.EasyText.csproj -c Release --no-build -o artifacts
          dotnet pack src/BalaReva.EasyImage/BalaReva.EasyImage.csproj -c Release --no-build -o artifacts
          dotnet pack src/BalaReva.Printer/BalaReva.Printer.csproj   -c Release --no-build -o artifacts
          dotnet pack src/BalaReva.EasyOutlook/BalaReva.EasyOutlook.csproj -c Release --no-build -o artifacts
          dotnet pack src/BalaReva.Word/BalaReva.Word.csproj -c Release --no-build -o artifacts
          dotnet pack src/BalaReva.Excel/BalaReva.Excel.csproj -c Release --no-build -o artifacts
          dotnet pack src/BalaReva.EasyPowerPoint/BalaReva.EasyPowerPoint.csproj -c Release --no-build -o artifacts

      # The audit found a published package shipping a .NET Framework assembly out of
      # a net6.0-windows folder. This makes sure we never ship that shape ourselves.
      - name: Verify package layout
        run: python3 audit/verify_package_layout.py 'artifacts/*.nupkg'

      # A workflow binds by type name, property name and property type. This reads all
      # three back out of what we just packed and holds them against the surface
      # recorded off the gallery, so a rename or a retyped argument fails here rather
      # than in somebody's process.
      - name: Verify binding surface
        run: |
          dotnet run --project tools/ApiSurface -c Release -- artifacts artifacts/surface.json
          python3 audit/verify_binding_surface.py artifacts/surface.json

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  # The Windows-only packages are only really tested here. EasyImage exercises real
  # GDI+ on real files; Printer and EasyOutlook run their activities against stand-ins,
  # since purging a print queue on a build agent is not something to do for real and no
  # agent has Outlook installed at all.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build everything
        run: dotnet build BalaReva.Revived.sln -c Release

      - name: Test everything
        run: dotnet test BalaReva.Revived.sln -c Release --no-build --verbosity normal
